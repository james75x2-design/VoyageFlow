# VoyageFlow Cloudflare Worker configuration
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "voyageflow"
main = "voyageflow_backend_worker.js"
compatibility_date = "2026-07-15"

[observability]
enabled = true

# Cloudflare Workers AI — for on-demand query embeddings (Week 3 hybrid search)
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "RAG_CACHE"
id = "fbddbf9a526f4297b0dbe4c7c6422424"
